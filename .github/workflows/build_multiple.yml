name: Build Multiple Boards

on:
  workflow_dispatch:
    inputs:
      boards:
        description: 'Comma-separated board names from device_db.yaml, e.g. SOCKET_MOES_ZK_EU16M,MODULE_TUYA_MINI_TS0002'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make python3 yq unzip wget gcc-arm-none-eabi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Cache Silicon Labs Tools
      uses: actions/cache@v4
      with:
        path: silabs_tools
        key: silabs-tools-2025.6.2

    - name: Cache Telink Tools
      uses: actions/cache@v4
      with:
        path: telink_tools
        key: telink-tools-v3.7.2.0

    - name: Cache Python Virtual Environment
      uses: actions/cache@v4
      with:
        path: .venv
        key: python-venv-${{ hashFiles('requirements.txt') }}

    - name: Install SDK and Toolchain
      run: |
        make setup || (
          echo "dumping log:" &&
          cat /home/runner/work/tuya-zigbee-switch/tuya-zigbee-switch/silabs_tools/slc-cli/bin/slc-cli/configuration/*.log
        )

    - name: Build boards
      env:
        BOARD_LIST: ${{ inputs.boards }}
      run: |
        set -euo pipefail

        source .venv/bin/activate

        IFS=',' read -ra RAW_BOARDS <<< "$BOARD_LIST"

        BUILT_COUNT=0

        for RAW_BOARD in "${RAW_BOARDS[@]}"; do
          BOARD="$(printf '%s' "$RAW_BOARD" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [ -z "$BOARD" ]; then
            continue
          fi

          echo "============================================================"
          echo "Processing board: $BOARD"
          echo "============================================================"

          if ! yq -e ".\"$BOARD\"" device_db.yaml >/dev/null; then
            echo "Board '$BOARD' does not exist in device_db.yaml"
            exit 1
          fi

          TYPE=$(yq -r ".\"$BOARD\".device_type" device_db.yaml)
          BUILD=$(yq -r ".\"$BOARD\".build" device_db.yaml)

          if [ "$BUILD" = "no" ]; then
            echo "Build is disabled for $BOARD in device_db.yaml"
            exit 1
          fi

          echo "Building $BOARD as router"
          BOARD="$BOARD" DEVICE_TYPE=router make board/build
          ls -l "bin/router/$BOARD/"

          if [ "$TYPE" = "end_device" ]; then
            echo "Building $BOARD as end_device"
            BOARD="$BOARD" DEVICE_TYPE=end_device make board/build
            ls -l "bin/end_device/${BOARD}_END_DEVICE/"
          fi

          BUILT_COUNT=$((BUILT_COUNT + 1))
        done

        if [ "$BUILT_COUNT" -eq 0 ]; then
          echo "No valid boards were provided"
          exit 1
        fi

        echo "Built $BUILT_COUNT board(s)."

    - name: Update converters and quirks
      run: |
        set -euo pipefail

        source .venv/bin/activate

        make tools/update_converters
        make tools/update_zha_quirk
        make tools/update_homed_extension
        make tools/update_supported_devices

    - name: Commit and push
      env:
        BOARD_LIST: ${{ inputs.boards }}
      run: |
        set -euo pipefail

        source .venv/bin/activate

        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

        git add bin/ zigbee2mqtt/ zha/ homed/ docs/supported_devices.md

        if ! git diff --cached --quiet; then
          git commit -m "Build firmware for selected boards: $BOARD_LIST"
        fi

        make tools/freeze_ota_links

        git add zigbee2mqtt/

        if ! git diff --cached --quiet; then
          git commit -m "Freeze OTA links"
        fi

        git push